version: '3.8'

services:
  ai-memory-bank:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./memory:/app/memory
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./embedder/model_cache:/app/embedder/model_cache
    environment:
      - LOG_LEVEL=INFO
      - DEFAULT_HOST=0.0.0.0
      - DEFAULT_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/statistics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

